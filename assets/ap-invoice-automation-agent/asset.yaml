apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: ap-invoice-automation-agent
  version: "1.0.0"

provides:
  apis:
    - name: ap-invoice-automation-agent
      kind: a2a
      ordId: customer.build:apiResource:tina-test-09-29-version-1-bc913.ap-invoice-automation-agent:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
